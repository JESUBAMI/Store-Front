<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart — Òjà</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/shared/css/style.css">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <!-- Paystack Inline JS SDK -->
    <!-- This SDK allows us to popup the secure Paystack payment modal directly on our web page without redirecting the user away. -->
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <script src="/shared/js/firebase-config.js"></script>
    <script src="/shared/js/cart.js"></script>
</head>

<body>

    <!-- ===================== NAVBAR ===================== -->
    <nav class="navbar navbar-expand-md navbar-market">
        <div class="container">

            <a class="brand-mark" href="index.html">Ò<span>j</span>à</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent"
                aria-label="Toggle navigation">
                <span class="toggler-bar"></span>
                <span class="toggler-bar"></span>
                <span class="toggler-bar"></span>
            </button>

            <div class="collapse navbar-collapse" id="navContent">

                <div class="search-pill mx-md-auto my-3 my-md-0">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="7" cy="7" r="5.5" stroke="#6B7178" stroke-width="1.4" />
                        <path d="M11.2 11.2L14.5 14.5" stroke="#6B7178" stroke-width="1.4" stroke-linecap="round" />
                    </svg>
                    <input type="text" placeholder="Search the market...">
                </div>

                <div class="d-flex align-items-center gap-4 justify-content-between justify-content-md-end">
                    <a href="cart.html" class="nav-icon-btn" aria-label="Cart">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M3 4H5L7.5 15.5C7.6 16.1 8.1 16.5 8.7 16.5H18.3C18.9 16.5 19.4 16.1 19.5 15.5L21 7H6"
                                stroke="#F6F1E7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
                            <circle cx="9" cy="20" r="1.4" fill="#F6F1E7" />
                            <circle cx="18" cy="20" r="1.4" fill="#F6F1E7" />
                        </svg>
                        <span class="cart-badge" id="cartBadge">0</span>
                    </a>
                    <div id="navUserArea">
                        <a href="login.html" class="btn-signin">Sign in</a>
                    </div>
                </div>

            </div>
        </div>
    </nav>

    <!-- ===================== CART ===================== -->
    <section class="cart-section">
        <div class="container">
            <h1 class="cart-title">Your Cart</h1>

            <p class="form-error alert alert-danger" id="orderError" hidden></p>

            <!-- Filled in by render() below -->
            <div class="row gy-4" id="cartLayout">
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ===================== SETUP =====================
        const cartLayout = document.getElementById("cartLayout");
        const cartBadge = document.getElementById("cartBadge");
        const orderError = document.getElementById("orderError");
        const DELIVERY_FEE = 1500;
        const SELLER_WHATSAPP = "2347062729106";

        let currentUser = null;
        let authResolved = false; // becomes true once Firebase has confirmed the session state

        // ===================== NAVBAR: signed-in account area =====================
        auth.onAuthStateChanged(function (user) {
            currentUser = user;
            authResolved = true;
            updateCheckoutButtonState();

            const area = document.getElementById("navUserArea");
            if (user) {
                const displayName = user.displayName || user.email.split("@")[0];
                area.innerHTML =
                    '<div class="dropdown nav-account-dropdown">' +
                    '<button class="btn-account-toggle dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">' +
                    'Hi, ' + displayName +
                    '</button>' +
                    '<ul class="dropdown-menu dropdown-menu-end nav-account-menu">' +
                    '<li><a class="dropdown-item" href="account.html">My Account</a></li>' +
                    '<li><a class="dropdown-item" href="orders.html">Orders</a></li>' +
                    '<li><hr class="dropdown-divider"></li>' +
                    '<li><a class="dropdown-item nav-logout-item" href="#" id="logoutBtn">Logout</a></li>' +
                    '</ul>' +
                    '</div>';
                document.getElementById("logoutBtn").addEventListener("click", function (event) {
                    event.preventDefault();
                    auth.signOut().then(function () { window.location.href = "index.html"; });
                });
            } else {
                area.innerHTML = '<a href="login.html" class="btn-signin">Sign in</a>';
            }
        });

        // Keeps the checkout button disabled with a neutral label until we
        // genuinely know whether someone is signed in — prevents wrongly
        // bouncing an already-logged-in person to the login page just
        // because they clicked before Firebase finished checking.
        function updateCheckoutButtonState() {
            const btn = document.getElementById("checkoutBtn");
            if (!btn) return;
            if (!authResolved) {
                btn.disabled = true;
                btn.textContent = "Checking your session...";
            } else {
                btn.disabled = false;
                btn.textContent = "Choose Payment Method";
            }
        }

        // ===================== RENDER THE CART =====================
        function render() {
            const cart = getCart();
            cartBadge.textContent = getCartCount();

            if (cart.length === 0) {
                cartLayout.innerHTML = "<div class='col-12'><p>Your cart is empty. <a href='index.html'>Browse products</a>.</p></div>";
                return;
            }

            let itemsHTML = "";
            let subtotal = 0;

            cart.forEach(function (line) {
                const lineTotal = line.price * line.quantity;
                subtotal += lineTotal;

                // Safety check: ensure price and quantity are valid numbers
                const price = parseFloat(line.price) || 0;
                const quantity = parseInt(line.quantity) || 1;

                itemsHTML +=
                    '<div class="cart-item">' +
                    '<div class="cart-item-image" style="background-color:#E7DCC3;">' +
                    '<span class="cart-item-image-label">' + line.name + '</span>' +
                    '</div>' +
                    '<div class="cart-item-body">' +
                    '<p class="cart-item-title">' + line.name + '</p>' +
                    '<p class="cart-item-price">&#8358;' + price.toLocaleString() + '</p>' +
                    '<div class="qty-stepper">' +
                    '<button type="button" class="qty-btn" data-action="decrease" data-id="' + line.id + '">&minus;</button>' +
                    '<input type="text" class="qty-input" value="' + quantity + '" readonly>' +
                    '<button type="button" class="qty-btn" data-action="increase" data-id="' + line.id + '">+</button>' +
                    '</div>' +
                    '</div>' +
                    '<button type="button" class="cart-item-remove" data-id="' + line.id + '" aria-label="Remove item">&times;</button>' +
                    '</div>';
            });

            const total = subtotal + DELIVERY_FEE;

            cartLayout.innerHTML =
                '<div class="col-lg-8">' + itemsHTML + '</div>' +
                '<div class="col-lg-4">' +
                '<div class="cart-summary">' +
                '<p class="cart-summary-title">Order Summary</p>' +
                '<div class="cart-summary-row"><span>Subtotal</span><span>&#8358;' + subtotal.toLocaleString() + '</span></div>' +
                '<div class="cart-summary-row"><span>Delivery</span><span>&#8358;' + DELIVERY_FEE.toLocaleString() + '</span></div>' +
                '<div class="receipt-rule"></div>' +
                '<div class="cart-summary-row cart-summary-total"><span>Total</span><span>&#8358;' + total.toLocaleString() + '</span></div>' +
                '<button type="button" class="btn-primary-market cart-checkout-btn" id="checkoutBtn">Choose Payment Method</button>' +
                '<div class="payment-panel" id="paymentPanel" hidden>' +
                '<p class="payment-panel-title">How would you like to pay?</p>' +
                '<div class="payment-option" data-method="whatsapp">' +
                '<p class="payment-option-title">Pay via WhatsApp</p>' +
                '<p class="payment-option-desc">Chat directly with the seller to arrange payment.</p>' +
                '</div>' +
                '<div class="payment-option" data-method="paystack">' +
                '<p class="payment-option-title">Pay with Card / Paystack</p>' +
                '<p class="payment-option-desc">Instant automated payment via debit card, USSD, or bank transfer.</p>' +
                '</div>' +
                '<div class="payment-option" data-method="bank">' +
                '<p class="payment-option-title">Manual Bank Transfer</p>' +
                '<p class="payment-option-desc">Get the account details and pay manually.</p>' +
                '</div>' +
                '<p class="payment-disclaimer">Only pay to the account shown after you select Bank Transfer. Òjà is not responsible for payments sent to any other account.</p>' +
                '</div>' +
                '</div>' +
                '</div>';

            // A fresh checkout button just got created above — make sure
            // it reflects whether we already know the sign-in state.
            updateCheckoutButtonState();

            document.querySelectorAll(".qty-btn").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    const id = btn.getAttribute("data-id");
                    const cart = getCart();
                    const line = cart.find(function (l) { return l.id === id; });
                    const newQty = btn.getAttribute("data-action") === "increase" ? line.quantity + 1 : line.quantity - 1;
                    updateCartQuantity(id, newQty);
                    render();
                });
            });

            document.querySelectorAll(".cart-item-remove").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    removeFromCart(btn.getAttribute("data-id"));
                    render();
                });
            });
        }

        // ===================== PLACE THE ORDER =====================
        function placeOrder(paymentMethod) {
            orderError.hidden = true;

            if (!currentUser) {
                window.location.href = "login.html";
                return;
            }

            const cart = getCart();
            if (cart.length === 0) {
                orderError.textContent = "Your cart is empty.";
                orderError.hidden = false;
                return;
            }

            const subtotal = cart.reduce(function (sum, line) { return sum + line.price * line.quantity; }, 0);
            const total = subtotal + DELIVERY_FEE;

            // A batch bundles "create the order" and "reduce stock on every
            // item" into one atomic operation — either both succeed, or
            // neither does, so the data can never end up half-updated.
            const batch = db.batch();
            const orderRef = db.collection("orders").doc();

            batch.set(orderRef, {
                customerId: currentUser.uid,
                customerEmail: currentUser.email,
                items: cart,
                subtotal: subtotal,
                deliveryFee: DELIVERY_FEE,
                total: total,
                status: "pending",
                paymentMethod: paymentMethod,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            cart.forEach(function (line) {
                const productRef = db.collection("products").doc(line.id);
                batch.update(productRef, { quantity: firebase.firestore.FieldValue.increment(-line.quantity) });
            });

            batch.commit()
                .then(function () {
                    localStorage.removeItem("ojaCart");

                    if (paymentMethod === "whatsapp") {
                        const message = "Hi, I'd like to pay for my Oja order (Total: NGN " + total.toLocaleString() + "). Order ID: " + orderRef.id.slice(0, 6).toUpperCase();
                        window.location.href = "https://wa.me/" + SELLER_WHATSAPP + "?text=" + encodeURIComponent(message);
                    } else if (paymentMethod === "paystack") {
                        // Launch Paystack Inline Pop-up
                        payWithPaystack(orderRef.id, total);
                    } else {
                        window.location.href = "receipt.html?id=" + orderRef.id + "&showBankDetails=1";
                    }
                })
                .catch(function (error) {
                    const message = error.code === "permission-denied"
                        ? "Firestore blocked this order — check your security rules."
                        : "Something went wrong placing your order. Please try again.";
                    orderError.textContent = message;
                    orderError.hidden = false;
                });
        }

        // ===================== PAYSTACK INTEGRATION FOR BEGINNERS =====================
        /*
          WHAT IS PAYSTACK?
          Paystack is a payment gateway that allows online businesses to receive payments safely
          via Debit Cards (Visa/Mastercard/Verve), USSD codes, Bank Transfers, and Mobile Money.

          HOW DOES THIS INLINE POP-UP WORK?
          1. We pass options (Public Key, Customer Email, Amount in Kobo, Reference ID) to `PaystackPop.setup()`.
          2. We call handler `.openIframe()` to pop up Paystack's secure modal over our website.
          3. When the customer finishes paying successfully, Paystack fires the `callback` function.
          4. Inside `callback`, we update our order status in Firestore from "pending" to "approved".
          5. If the customer closes the payment popup without paying, `onClose` is triggered.

          NOTE ON CURRENCY:
          Paystack processes Nigerian Naira (NGN) amounts in **kobo** (1 NGN = 100 kobo).
          So NGN 5,000 becomes 5,000 * 100 = 500,000 kobo.
        */
        function payWithPaystack(orderId, amountInNaira) {
            // Retrieve key from configuration or fallback
            const apiKey = (typeof PAYSTACK_PUBLIC_KEY !== "undefined" && PAYSTACK_PUBLIC_KEY)
                ? PAYSTACK_PUBLIC_KEY
                : "pk_test_13b81a13a072c75675a757c317c9c78e26bee02f";

            // Validate if key is configured properly (placeholder keys or empty/short keys will fail)
            const isPlaceholderKey = apiKey.includes("YOUR_PAYSTACK_PUBLIC_KEY") || apiKey.includes("0123456789abcdef") || apiKey.includes("placeholder") || !apiKey.startsWith("pk_") || apiKey.length < 20;

            if (isPlaceholderKey) {
                orderError.textContent = "Paystack payment is not configured yet. Please enter your valid Paystack Public Key (starting with 'pk_test_' or 'pk_live_') in shared/js/firebase-config.js.";
                orderError.hidden = false;
                window.scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }

            try {
                const handler = PaystackPop.setup({
                    key: apiKey,
                    email: currentUser.email,
                    amount: Math.round(amountInNaira * 100), // Amount in kobo
                    currency: "NGN",
                    ref: "OJA_" + orderId + "_" + Math.floor((Math.random() * 1000000000) + 1), // Unique transaction reference
                    metadata: {
                        orderId: orderId,
                        custom_fields: [
                            {
                                display_name: "Order ID",
                                variable_name: "order_id",
                                value: orderId
                            }
                        ]
                    },
                    callback: function (response) {
                        // response.reference contains the Paystack transaction reference string
                        console.log("Paystack payment successful! Reference:", response.reference);

                        // Update order in Firestore with payment reference, keeping status as 'pending' for admin approval
                        db.collection("orders").doc(orderId).update({
                            status: "pending",
                            paymentReference: response.reference,
                            paidAt: firebase.firestore.FieldValue.serverTimestamp()
                        }).then(function () {
                            // Redirect to receipt with pending status!
                            window.location.href = "receipt.html?id=" + orderId;
                        }).catch(function (err) {
                            console.error("Error updating order after Paystack payment:", err); window.location.href = "receipt.html?id=" + orderId;
                        });
                    },
                    onClose: function () {
                        // Triggered when user closes Paystack modal before completing payment
                        alert("Payment popup closed. You can view your pending order in 'My Orders'.");
                        window.location.href = "receipt.html?id=" + orderId;
                    }
                });

                handler.openIframe();
            } catch (err) {
                console.error("Paystack initialization error:", err);
                orderError.textContent = "Could not start Paystack transaction. Please check that a valid Paystack Public Key is configured.";
                orderError.hidden = false;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        render();

        // ===================== CHECKOUT BUTTON + PAYMENT OPTION CLICKS =====================
        document.addEventListener("click", function (event) {
            if (event.target && event.target.id === "checkoutBtn") {
                if (!currentUser) {
                    window.location.href = "login.html";
                    return;
                }
                if (getCart().length === 0) return;

                document.getElementById("paymentPanel").hidden = false;
                event.target.hidden = true;
                return;
            }

            const optionEl = event.target.closest(".payment-option");
            if (optionEl) {
                document.querySelectorAll(".payment-option").forEach(function (card) {
                    card.classList.remove("selected");
                });
                optionEl.classList.add("selected");
                placeOrder(optionEl.getAttribute("data-method"));
            }
        });
    </script>
</body>

</html>
