<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders — Òjà</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/css/style.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="../shared/js/firebase-config.js"></script>
    <script src="../shared/js/cart.js"></script>
</head>

<body>
    <nav class="navbar navbar-market">
        <div class="container">
            <a class="brand-mark" href="index.html">Ò<span>j</span>à</a>
            <div class="d-flex align-items-center gap-4 ms-auto">
                <a href="cart.html" class="nav-icon-btn" aria-label="Cart">Cart <span class="cart-badge" id="cartBadge">0</span></a>
                <a href="account.html" class="btn-signin">My account</a>
            </div>
        </div>
    </nav>

    <main class="receipt-page">
        <div class="container">
            <div class="receipt-page-inner">
                <p class="receipt-page-eyebrow">Your purchase history</p>
                <h1 class="receipt-page-title">My Orders</h1>
                <div id="ordersContainer"><p>Loading your orders...</p></div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById("cartBadge").textContent = getCartCount();
        const ordersContainer = document.getElementById("ordersContainer");

        function renderOrders(snapshot) {
            if (snapshot.empty) {
                ordersContainer.innerHTML = '<p>You have no orders yet. <a href="index.html">Start shopping</a>.</p>';
                return;
            }

            const orders = snapshot.docs.map(function (doc) {
                return { id: doc.id, data: doc.data() };
            }).sort(function (first, second) {
                const firstDate = first.data.createdAt ? first.data.createdAt.toMillis() : 0;
                const secondDate = second.data.createdAt ? second.data.createdAt.toMillis() : 0;
                return secondDate - firstDate;
            });

            ordersContainer.innerHTML = orders.map(function (order) {
                const data = order.data;
                const date = data.createdAt
                    ? data.createdAt.toDate().toLocaleDateString("en-US", { day: "numeric", month: "short", year: "numeric" })
                    : "Recent order";
                const status = data.status || "pending";
                const itemCount = (data.items || []).reduce(function (total, item) { return total + item.quantity; }, 0);
                return '<article class="order-history-row">' +
                    '<div><strong>Order ' + order.id.slice(0, 6).toUpperCase() + '</strong><span>' + date + ' · ' + itemCount + (itemCount === 1 ? ' item' : ' items') + '</span></div>' +
                    '<div><strong>&#8358;' + (data.total || 0).toLocaleString() + '</strong><span class="order-status order-status-' + status + '">' + status + '</span></div>' +
                    '<a href="receipt.html?id=' + order.id + '" class="detail-secondary-link">View receipt</a>' +
                    '</article>';
            }).join("");
        }

        auth.onAuthStateChanged(function (user) {
            if (!user) {
                window.location.href = "login.html";
                return;
            }

            db.collection("orders").where("customerId", "==", user.uid).get()
                .then(renderOrders)
                .catch(function () {
                    ordersContainer.innerHTML = "<p>We could not load your orders right now.</p>";
                });
        });
    </script>
</body>

</html>
