<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Òjà</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../shared/css/style.css">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="../shared/js/firebase-config.js"></script>
</head>

<body>

    <!-- Auth header -->
    <header class="auth-header">
        <div class="container">
            <a class="brand-mark" href="index.html">Ò<span>j</span>à</a>
        </div>
    </header>

    <!-- Sign in -->
    <div class="auth-wrap">
        <div class="auth-card">
            <p class="auth-title">Welcome back</p>
            <p class="auth-sub">Sign in to track your orders and receipts.</p>

            <p class="form-error" id="formError" hidden></p>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-input" type="email" id="email" placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-input" type="password" id="password" placeholder="********">
                </div>

                <button class="btn-save" type="submit">Sign in</button>
            </form>

            <p class="auth-switch">New here? <a href="signup.html">Create an account</a></p>
        </div>
    </div>

    <script>
        const form = document.getElementById("loginForm");
        const errorBox = document.getElementById("formError");
        const submitBtn = form.querySelector("button[type='submit']");

        function showError(message) {
            errorBox.textContent = message;
            errorBox.hidden = false;
        }

        function clearError() {
            errorBox.hidden = true;
            errorBox.textContent = "";
        }

        form.addEventListener("submit", function (event) {
            event.preventDefault();
            clearError();

            const mail = document.getElementById("email").value.trim();
            const pass = document.getElementById("password").value;

            if (!mail || !pass) {
                showError("Please enter both your email and password.");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Signing in...";

            auth.signInWithEmailAndPassword(mail, pass)
                .then(function () {
                    window.location.href = "index.html";
                })
                .catch(function (error) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Sign in";

                    if (error.code === "auth/invalid-email") {
                        showError("Please enter a valid email address.");
                    } else if (error.code === "auth/user-not-found" || error.code === "auth/wrong-password" || error.code === "auth/invalid-credential") {
                        showError("Email or password is incorrect.");
                    } else {
                        showError("Something went wrong. Please try again.");
                    }
                });
        });
    </script>

</body>
</html>
