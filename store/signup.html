<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create your account — Òjà</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../shared/css/style.css">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="../shared/js/firebase-config.js"></script>
</head>

<body>

    <!-- Auth header -->
    <header class="auth-header">
        <div class="container">
            <a class="brand-mark" href="index.html">Ò<span>j</span>à</a>
        </div>
    </header>

    <!-- Sign up -->
    <div class="auth-wrap">
        <div class="auth-card">
            <p class="auth-title">Create your account</p>
            <p class="auth-sub">Sign up to order and track your receipts.</p>
            <button type="button" class="btn-google" id="googleBtn">
                <svg width="18" height="18" viewBox="0 0 18 18">
                    <path fill="#4285F4"
                        d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" />
                    <path fill="#34A853"
                        d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" />
                    <path fill="#FBBC05"
                        d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z" />
                    <path fill="#EA4335"
                        d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.167 6.656 3.58 9 3.58z" />
                </svg>
                Continue with Google
            </button>

            <div class="auth-divider"><span>or</span></div>



            <p class="form-error alert alert-danger" id="formError" hidden></p>
            <p class="form-success alert alert-success" id="formSuccess" hidden></p>

            <form id="signupForm">
                <div class="form-group">
                    <label class="form-label" for="fullName">Full name</label>
                    <input class="form-input" type="text" id="fullName" placeholder="Your name">
                </div>
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-input" type="email" id="email" placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-input" type="password" id="password" placeholder="********">
                </div>
                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirm password</label>
                    <input class="form-input" type="password" id="confirmPassword" placeholder="********">
                </div>

                <button class="btn-save" type="submit">Create account</button>
            </form>
            <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>

        </div>


    </div>

    <script>
        const form = document.getElementById("signupForm");
        const errorBox = document.getElementById("formError");
        const successBox = document.getElementById("formSuccess");
        const submitBtn = form.querySelector("button[type='submit']");

        function showError(message) {
            successBox.hidden = true;
            errorBox.textContent = message;
            errorBox.hidden = false;
        }

        function showSuccess(message) {
            errorBox.hidden = true;
            successBox.textContent = message;
            successBox.hidden = false;
        }

        function clearMessages() {
            errorBox.hidden = true;
            successBox.hidden = true;
        }

        const googleBtn = document.getElementById("googleBtn");
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        googleBtn.addEventListener("click", function () {
            clearMessages();

            auth.signInWithPopup(googleProvider)
                .then(function (result) {
                    const user = result.user;
                    const isNewUser = result.additionalUserInfo.isNewUser;

                    if (isNewUser) {
                        return db.collection("users").doc(user.uid).set({
                            fullName: user.displayName || "",
                            email: user.email,
                            role: "client",
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }
                })
                .then(function () {
                    window.location.href = "index.html";
                })
                .catch(function (error) {
                    showError("Google sign-in failed. Please try again.");
                });
        });

        form.addEventListener("submit", function (event) {
            event.preventDefault();
            clearMessages();

            const fName = document.getElementById("fullName").value.trim();
            const mail = document.getElementById("email").value.trim();
            const pass = document.getElementById("password").value;
            const confirm = document.getElementById("confirmPassword").value;

            if (!fName || !mail || !pass || !confirm) {
                showError("Please fill in every field.");
                return;
            }

            if (pass.length < 6) {
                showError("Password must be at least 6 characters.");
                return;
            }

            if (pass !== confirm) {
                showError("Passwords do not match.");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Creating account...";

            auth.createUserWithEmailAndPassword(mail, pass)
                .then(function (userCredential) {
                    const user = userCredential.user;

                    return db.collection("users").doc(user.uid).set({
                        fullName: fName,
                        email: mail,
                        role: "client",
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                })
                .then(function () {
                    showSuccess("Account created! Taking you to the store...");
                    setTimeout(function () {
                        window.location.href = "index.html";
                    }, 700);
                })
                .catch(function (error) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Create account";

                    if (error.code === "auth/email-already-in-use") {
                        showError("An account with this email already exists.");
                    } else if (error.code === "auth/invalid-email") {
                        showError("Please enter a valid email address.");
                    } else if (error.code === "auth/weak-password") {
                        showError("Password is too weak — use at least 6 characters.");
                    } else {
                        showError("Something went wrong. Please try again.");
                    }
                });
        });
    </script>

</body>

</html>
