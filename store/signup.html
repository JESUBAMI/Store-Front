<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create your account — Òjà</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../shared/css/style.css">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="../shared/js/firebase-config.js"></script>
</head>

<body>

    <!-- Auth header -->
    <header class="auth-header">
        <div class="container">
            <a class="brand-mark" href="index.html">Ò<span>j</span>à</a>
        </div>
    </header>

    <!-- Sign up -->
    <div class="auth-wrap">
        <div class="auth-card">
            <p class="auth-title">Create your account</p>
            <p class="auth-sub">Sign up to order and track your receipts.</p>

            <p class="form-error" id="formError" hidden></p>

            <form id="signupForm">
                <div class="form-group">
                    <label class="form-label" for="fullName">Full name</label>
                    <input class="form-input" type="text" id="fullName" placeholder="Your name">
                </div>
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-input" type="email" id="email" placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-input" type="password" id="password" placeholder="********">
                </div>
                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirm password</label>
                    <input class="form-input" type="password" id="confirmPassword" placeholder="********">
                </div>

                <button class="btn-save" type="submit">Create account</button>
            </form>

            <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
        </div>
    </div>

</body>
<script>
    const form = document.getElementById("signupForm");
const errorBox = document.getElementById("formError");
const submitBtn = form.querySelector("button[type='submit']");

function showError(message) {
    errorBox.textContent = message;
    errorBox.hidden = false;
}

function clearError() {
    errorBox.hidden = true;
    errorBox.textContent = "";
}

form.addEventListener("submit", function (event) {
    event.preventDefault();
    clearError();

    const fName = document.getElementById("fullName").value.trim();
    const mail = document.getElementById("email").value.trim();
    const pass = document.getElementById("password").value.trim();
    const confirm = document.getElementById("confirmPassword").value;

    if (!fName || !mail || !pass || !confirm) {
        showError("please fill in every field.");
        return;
    }

    if (pass.length < 6) {
        showError("Password must be at least 6 characters.");
        return;
    }

    if (pass !== confirm) {
        showError("Password do not match.");
        return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Creating account...";

    auth.createUserWithEmailAndPassword(mail, pass)
        .then(function (userCredential) {
            const user = userCredential.user;

            return db.collection("users").doc(user.uid).set({
                fullName: fName,
                email: mail,
                role: "client",
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        })
        .then(function () {
            window.location.href = "index.html";
        })
        .catch(function (error) {
            submitBtn.disabled = false;
            submitBtn.textContent = "Create account";

            if (error.code === "auth/email-already-in-use") {
                showError("An account with this email already exists.");
            } else if (error.code === "auth/invalid-email") {
                showError("Please enter a valid email address.");
            } else if (error.code === "auth/weak-password") {
                showError("Password is too weak — use at least 6 characters.");
            } else {
                showError("Something went wrong. Please try again.");
            }
        });
});
</script>

</html>
