<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Receipt — Òjà</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../shared/css/style.css">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="../shared/js/firebase-config.js"></script>
    <script src="../shared/js/cart.js"></script>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-md navbar-market">
        <div class="container">

            <a class="brand-mark" href="index.html">Ò<span>j</span>à</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent"
                aria-label="Toggle navigation">
                <span class="toggler-bar"></span>
                <span class="toggler-bar"></span>
                <span class="toggler-bar"></span>
            </button>

            <div class="collapse navbar-collapse" id="navContent">

                <div class="search-pill mx-md-auto my-3 my-md-0">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="7" cy="7" r="5.5" stroke="#6B7178" stroke-width="1.4" />
                        <path d="M11.2 11.2L14.5 14.5" stroke="#6B7178" stroke-width="1.4" stroke-linecap="round" />
                    </svg>
                    <input type="text" placeholder="Search the market...">
                </div>

                <div class="d-flex align-items-center gap-4 justify-content-between justify-content-md-end">
                    <a href="cart.html" class="nav-icon-btn" aria-label="Cart">
                        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M4 6.5H18L17 16.5C16.9 17.6 16 18.4 14.9 18.4H7.1C6 18.4 5.1 17.6 5 16.5L4 6.5Z"
                                stroke="#F6F1E7" stroke-width="1.4" stroke-linejoin="round" />
                            <path d="M7.5 6.5V5.2C7.5 3.4 9 2 10.7 2H11.3C13 2 14.5 3.4 14.5 5.2V6.5" stroke="#F6F1E7"
                                stroke-width="1.4" />
                        </svg>
                        <span class="cart-badge" id="cartBadge">0</span>
                    </a>
                    <a href="login.html" class="btn-signin">Sign in</a>
                </div>

            </div>
        </div>
    </nav>

    <!-- Receipt -->
    <section class="receipt-page">
        <div class="container">
            <div class="receipt-page-inner" id="receiptContainer">
                <p>Loading your receipt...</p>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const receiptContainer = document.getElementById("receiptContainer");
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get("id");

        document.getElementById("cartBadge").textContent = getCartCount();

        function loadReceipt() {
            if (!orderId) {
                receiptContainer.innerHTML = "<p>No order specified.</p>";
                return;
            }

            db.collection("orders").doc(orderId).get()
                .then(function (doc) {
                    if (!doc.exists) {
                        receiptContainer.innerHTML = "<p>This order could not be found.</p>";
                        return;
                    }

                    const order = doc.data();
                    const isApproved = order.status === "approved";
                    const orderDate = order.createdAt
                        ? order.createdAt.toDate().toLocaleDateString("en-US", { day: "numeric", month: "short", year: "numeric" })
                        : "";

                    const itemLines = order.items.map(function (item) {
                        return '<div class="receipt-line"><span>' + item.quantity + 'x ' + item.name + '</span><span>&#8358;' + (item.price * item.quantity).toLocaleString() + '</span></div>';
                    }).join("");

                    const stampClass = isApproved ? "receipt-stamp-approved" : "receipt-stamp-pending";
                    const stampText = isApproved ? "Approved" : "Pending";
                    const footerText = isApproved
                        ? "Payment confirmed. Thank you for shopping with us."
                        : "Waiting for the seller to confirm your payment.";

                    const showBankDetails = params.get("showBankDetails") === "1" && order.paymentMethod === "bank" && !isApproved;

                    const bankPanel = showBankDetails
                        ? '<div class="bank-details">' +
                            '<p class="bank-details-title">Pay to this account</p>' +
                            '<p class="bank-details-line"><strong>Bank:</strong> Your Bank Name</p>' +
                            '<p class="bank-details-line"><strong>Account Number:</strong> 0123456789</p>' +
                            '<p class="bank-details-line"><strong>Account Name:</strong> Your Business Name</p>' +
                            '<p class="payment-disclaimer">Only pay to this exact account. We are not responsible for payments made elsewhere.</p>' +
                          '</div>'
                        : '';

                    receiptContainer.innerHTML =
                        '<p class="receipt-page-eyebrow">Order status: ' + stampText + '</p>' +
                        '<h1 class="receipt-page-title">Your Receipt</h1>' +
                        '<div class="receipt-card receipt-card-flat">' +
                            '<p class="receipt-brand">ÒJÀ</p>' +
                            '<p class="receipt-meta">RECEIPT NO. ' + doc.id.slice(0, 6).toUpperCase() + ' &middot; ' + orderDate + '</p>' +
                            '<div class="receipt-rule"></div>' +
                            itemLines +
                            '<div class="receipt-line"><span>Delivery</span><span>&#8358;' + order.deliveryFee.toLocaleString() + '</span></div>' +
                            '<div class="receipt-rule"></div>' +
                            '<div class="receipt-line receipt-total"><span>TOTAL</span><span>&#8358;' + order.total.toLocaleString() + '</span></div>' +
                            '<p class="receipt-footer">' + footerText + '</p>' +
                            '<span class="receipt-stamp ' + stampClass + '">' + stampText + '</span>' +
                        '</div>' +
                        bankPanel +
                        '<a href="index.html" class="receipt-page-back">Continue shopping &rarr;</a>';
                })
                .catch(function (error) {
                    if (error.code === "permission-denied") {
                        receiptContainer.innerHTML = "<p>You don't have permission to view this order.</p>";
                    } else {
                        receiptContainer.innerHTML = "<p>Something went wrong loading this receipt.</p>";
                    }
                });
        }

        auth.onAuthStateChanged(function (user) {
            if (!user) {
                receiptContainer.innerHTML = '<p>Please <a href="login.html">sign in</a> to view this receipt.</p>';
                return;
            }
            loadReceipt();
        });
    </script>
</body>

</html>
