<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading... — Òjà</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../shared/css/style.css">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="../shared/js/firebase-config.js"></script>
    <script src="../shared/js/cart.js"></script>
    <script src="../shared/js/presence.js"></script>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-md navbar-market">
        <div class="container">

            <a class="brand-mark" href="index.html">Ò<span>j</span>à</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent"
                aria-label="Toggle navigation">
                <span class="toggler-bar"></span>
                <span class="toggler-bar"></span>
                <span class="toggler-bar"></span>
            </button>

            <div class="collapse navbar-collapse" id="navContent">

                <div class="search-pill mx-md-auto my-3 my-md-0">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="7" cy="7" r="5.5" stroke="#6B7178" stroke-width="1.4" />
                        <path d="M11.2 11.2L14.5 14.5" stroke="#6B7178" stroke-width="1.4" stroke-linecap="round" />
                    </svg>
                    <input type="text" placeholder="Search the market...">
                </div>

                <div class="d-flex align-items-center gap-4 justify-content-between justify-content-md-end">
                    <a href="cart.html" class="nav-icon-btn" aria-label="Cart">
                        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M4 6.5H18L17 16.5C16.9 17.6 16 18.4 14.9 18.4H7.1C6 18.4 5.1 17.6 5 16.5L4 6.5Z"
                                stroke="#F6F1E7" stroke-width="1.4" stroke-linejoin="round" />
                            <path d="M7.5 6.5V5.2C7.5 3.4 9 2 10.7 2H11.3C13 2 14.5 3.4 14.5 5.2V6.5" stroke="#F6F1E7"
                                stroke-width="1.4" />
                        </svg>
                        <span class="cart-badge" id="cartBadge">0</span>
                    </a>
                    <div id="navUserArea">
                        <a href="login.html" class="btn-signin">Sign in</a>
                    </div>
                </div>

            </div>
        </div>
    </nav>

    <!-- Product detail -->
    <section class="product-detail">
        <div class="container" id="productContainer">
            <p>Loading product...</p>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const productContainer = document.getElementById("productContainer");
        const params = new URLSearchParams(window.location.search);
        const productId = params.get("id");

        document.getElementById("cartBadge").textContent = getCartCount();

        auth.onAuthStateChanged(function (user) {
            const area = document.getElementById("navUserArea");
            if (user) {
                area.innerHTML = '<div class="nav-user">' +
                    '<span class="nav-user-name">' + (user.displayName || user.email) + '</span>' +
                    '<button type="button" class="btn-logout" id="logoutBtn">Log out</button>' +
                    '</div>';
                document.getElementById("logoutBtn").addEventListener("click", function () {
                    auth.signOut().then(function () { window.location.href = "index.html"; });
                });
            } else {
                area.innerHTML = '<a href="login.html" class="btn-signin">Sign in</a>';
            }
        });

        if (!productId) {
            productContainer.innerHTML = "<p>No product specified.</p>";
        } else {
            db.collection("products").doc(productId).get()
                .then(function (doc) {
                    if (!doc.exists) {
                        productContainer.innerHTML = "<p>This product could not be found.</p>";
                        return;
                    }

                    const product = doc.data();
                    const isSoldOut = product.quantity <= 0;

                    document.title = product.name + " — Òjà";

                    const priceRow = product.discountPrice
                        ? '<span class="detail-price">&#8358;' + product.discountPrice.toLocaleString() + '</span>' +
                        '<span class="detail-price-original">&#8358;' + product.price.toLocaleString() + '</span>' +
                        '<span class="discount-tag">-' + Math.round((1 - product.discountPrice / product.price) * 100) + '%</span>'
                        : '<span class="detail-price">&#8358;' + product.price.toLocaleString() + '</span>';

                    const stockRow = isSoldOut
                        ? '<p class="detail-stock out-of-stock">Currently unavailable</p>'
                        : '<p class="detail-stock"><span class="stock-dot"></span>' + product.quantity + ' in stock</p>';

                    const orderButton = isSoldOut
                        ? '<span class="btn-primary-market detail-order-btn" style="opacity:0.5;">Sold out</span>'
                        : '<button type="button" class="btn-primary-market detail-order-btn" id="orderBtn">Order Now</button>';

                    // FIX: use the uploaded photo when present, otherwise the placeholder block
                    const imageInner = product.photoUrl
                        ? '<img src="' + product.photoUrl + '" alt="' + product.name + '">'
                        : '<span class="detail-image-label">' + (product.category || "Product") + '</span>';
                    const imageStyle = product.photoUrl ? "" : "background-color:#E7DCC3;";

                    productContainer.innerHTML =
                        '<div class="row gy-4">' +
                        '<div class="col-md-6">' +
                        '<div class="detail-image" style="' + imageStyle + '">' +
                        imageInner +
                        '</div>' +
                        '</div>' +
                        '<div class="col-md-6">' +
                        '<p class="detail-eyebrow">' + (product.category || "General") + '</p>' +
                        '<h1 class="detail-title">' + product.name + '</h1>' +
                        '<div class="detail-price-row">' + priceRow + '</div>' +
                        stockRow +
                        '<p class="detail-description">' + (product.description || "No description provided for this product yet.") + '</p>' +
                        '<div class="detail-qty-row">' +
                        '<label class="form-label">Quantity</label>' +
                        '<div class="qty-stepper">' +
                        '<button type="button" class="qty-btn" aria-label="Decrease quantity">&minus;</button>' +
                        '<input type="text" class="qty-input" value="1" readonly>' +
                        '<button type="button" class="qty-btn" aria-label="Increase quantity">+</button>' +
                        '</div>' +
                        '</div>' +
                        orderButton +
                        '<div id="liveViewersBox"></div>' +
                        '</div>' +
                        '</div>';

                    // NEW: presence — announce that this browser is viewing
                    // this product, and show a live "X people viewing" pill.
                    // See shared/js/presence.js for how the heartbeat works.
                    startWatchingProduct(productId, product.name);
                    watchViewersForProduct(productId, function (count) {
                        const box = document.getElementById("liveViewersBox");
                        if (!box) return;
                        box.innerHTML = count > 0
                            ? '<div class="live-viewers"><span class="live-dot"></span>' + count + (count === 1 ? " person viewing this now" : " people viewing this now") + '</div>'
                            : "";
                    });

                    if (!isSoldOut) {
                        const qtyInput = document.querySelector(".qty-input");
                        const qtyButtons = document.querySelectorAll(".qty-btn");

                        qtyButtons[0].addEventListener("click", function () {
                            const current = parseInt(qtyInput.value, 10);
                            if (current > 1) qtyInput.value = current - 1;
                        });

                        qtyButtons[1].addEventListener("click", function () {
                            const current = parseInt(qtyInput.value, 10);
                            if (current < product.quantity) qtyInput.value = current + 1;
                        });

                        document.getElementById("orderBtn").addEventListener("click", function () {
                            addToCart({
                                id: productId,
                                name: product.name,
                                price: product.discountPrice || product.price,
                                quantity: parseInt(qtyInput.value, 10)
                            });
                            window.location.href = "cart.html";
                        });
                    }
                })
                .catch(function (error) {
                    const message = error.code === "permission-denied"
                        ? "Firestore blocked this read — check your security rules."
                        : "Something went wrong loading this product.";
                    productContainer.innerHTML = "<p>" + message + "</p>";
                });
        }

        window.addEventListener("pagehide", stopWatchingProduct);
    </script>
</body>

</html>
