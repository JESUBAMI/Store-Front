<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart — Òjà</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../shared/css/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-md navbar-market">
        <div class="container">

            <a class="brand-mark" href="index.html">Ò<span>j</span>à</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent"
                aria-label="Toggle navigation">
                <span class="toggler-bar"></span>
                <span class="toggler-bar"></span>
                <span class="toggler-bar"></span>
            </button>

            <div class="collapse navbar-collapse" id="navContent">

                <div class="search-pill mx-md-auto my-3 my-md-0">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="7" cy="7" r="5.5" stroke="#6B7178" stroke-width="1.4" />
                        <path d="M11.2 11.2L14.5 14.5" stroke="#6B7178" stroke-width="1.4" stroke-linecap="round" />
                    </svg>
                    <input type="text" placeholder="Search the market...">
                </div>

                <div class="d-flex align-items-center gap-4 justify-content-between justify-content-md-end">
                    <a href="cart.html" class="nav-icon-btn" aria-label="Cart">
                        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M4 6.5H18L17 16.5C16.9 17.6 16 18.4 14.9 18.4H7.1C6 18.4 5.1 17.6 5 16.5L4 6.5Z"
                                stroke="#F6F1E7" stroke-width="1.4" stroke-linejoin="round" />
                            <path d="M7.5 6.5V5.2C7.5 3.4 9 2 10.7 2H11.3C13 2 14.5 3.4 14.5 5.2V6.5" stroke="#F6F1E7"
                                stroke-width="1.4" />
                        </svg>
                        <span class="cart-badge">2</span>
                    </a>
                    <a href="login.html" class="btn-signin">Sign in</a>
                </div>

            </div>
        </div>
    </nav>

    <!-- Cart -->
    <section class="cart-section">
        <div class="container">
            <h1 class="cart-title">Your Cart</h1>

            <div class="row gy-4">

                <div class="col-lg-8">

                    <div class="cart-item">
                        <div class="cart-item-image" style="background-color:#E7DCC3;">
                            <span class="cart-item-image-label">Ankara Shirt</span>
                        </div>
                        <div class="cart-item-body">
                            <p class="cart-item-title">Men's Ankara Print Shirt</p>
                            <p class="cart-item-price">&#8358;8,500</p>
                            <div class="qty-stepper">
                                <button type="button" class="qty-btn" aria-label="Decrease quantity">&minus;</button>
                                <input type="text" class="qty-input" value="1" readonly>
                                <button type="button" class="qty-btn" aria-label="Increase quantity">+</button>
                            </div>
                        </div>
                        <button type="button" class="cart-item-remove" aria-label="Remove item">&times;</button>
                    </div>

                    <div class="cart-item">
                        <div class="cart-item-image" style="background-color:#D9E3D0;">
                            <span class="cart-item-image-label">Sandals</span>
                        </div>
                        <div class="cart-item-body">
                            <p class="cart-item-title">Leather Sandals</p>
                            <p class="cart-item-price">&#8358;6,000</p>
                            <div class="qty-stepper">
                                <button type="button" class="qty-btn" aria-label="Decrease quantity">&minus;</button>
                                <input type="text" class="qty-input" value="1" readonly>
                                <button type="button" class="qty-btn" aria-label="Increase quantity">+</button>
                            </div>
                        </div>
                        <button type="button" class="cart-item-remove" aria-label="Remove item">&times;</button>
                    </div>

                </div>

                <div class="col-lg-4">
                    <div class="cart-summary">
                        <p class="cart-summary-title">Order Summary</p>
                        <div class="cart-summary-row"><span>Subtotal</span><span>&#8358;14,500</span></div>
                        <div class="cart-summary-row"><span>Delivery</span><span>&#8358;1,500</span></div>
                        <div class="receipt-rule"></div>
                        <div class="cart-summary-row cart-summary-total"><span>Total</span><span>&#8358;16,000</span>
                        </div>
                        <a href="#" class="btn-primary-market cart-checkout-btn">Proceed to Checkout</a>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
