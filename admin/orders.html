<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders — Òjà Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../shared/css/style.css">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="../shared/js/firebase-config.js"></script>
    <script src="../shared/js/admin-guard.js"></script>
</head>

<body>

    <div class="admin-shell">

        <aside class="admin-sidebar">
            <a class="brand-mark admin-brand" href="dashboard.html">Ò<span>j</span>à</a>
            <nav class="admin-nav">
                <a href="dashboard.html" class="admin-nav-item">Dashboard</a>
                <a href="add-product.html" class="admin-nav-item">Add product</a>
                <a href="products.html" class="admin-nav-item">Products</a>
                <a href="orders.html" class="admin-nav-item active">Orders</a>
            </nav>
        </aside>

        <main class="admin-main">
            <p class="admin-title">Orders</p>

            <div class="products-table-wrap">
                <table class="products-table">
                    <thead>
                        <tr>
                            <th>Order</th>
                            <th>Customer</th>
                            <th>Items</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                    </tbody>
                </table>
            </div>

        </main>

    </div>

    <script>
        const tableBody = document.getElementById("ordersTableBody");

        function loadOrders() {
            tableBody.innerHTML = "<tr><td colspan='6'>Loading...</td></tr>";

            db.collection("orders").orderBy("createdAt", "desc").get()
                .then(function (snapshot) {
                    tableBody.innerHTML = "";

                    if (snapshot.empty) {
                        tableBody.innerHTML = "<tr><td colspan='6'>No orders yet.</td></tr>";
                        return;
                    }

                    snapshot.docs.forEach(function (doc) {
                        const order = doc.data();
                        const itemsSummary = order.items.map(function (item) {
                            return item.quantity + "x " + item.name;
                        }).join(", ");

                        const statusBadge = order.status === "approved"
                            ? '<span class="status-badge status-approved">Approved</span>'
                            : '<span class="status-badge status-pending">Pending</span>';

                        const action = order.status === "pending"
                            ? '<a href="#" class="table-action approve" data-id="' + doc.id + '">Approve</a> <a href="../store/receipt.html?id=' + doc.id + '" class="table-action" target="_blank">View</a>'
                            : '<a href="../store/receipt.html?id=' + doc.id + '" class="table-action" target="_blank">View receipt</a>';

                        const row = document.createElement("tr");
                        row.innerHTML =
                            '<td>#' + doc.id.slice(0, 6).toUpperCase() + '</td>' +
                            '<td>' + order.customerEmail + '</td>' +
                            '<td>' + itemsSummary + '</td>' +
                            '<td>&#8358;' + order.total.toLocaleString() + '</td>' +
                            '<td>' + statusBadge + '</td>' +
                            '<td>' + action + '</td>';

                        tableBody.appendChild(row);
                    });

                    document.querySelectorAll(".table-action.approve").forEach(function (link) {
                        link.addEventListener("click", function (event) {
                            event.preventDefault();
                            const id = link.getAttribute("data-id");
                            db.collection("orders").doc(id).update({
                                status: "approved",
                                approvedAt: firebase.firestore.FieldValue.serverTimestamp()
                            }).then(loadOrders);
                        });
                    });
                })
                .catch(function () {
                    tableBody.innerHTML = "<tr><td colspan='6'>Could not load orders.</td></tr>";
                });
        }

        loadOrders();
    </script>

</body>

</html>
