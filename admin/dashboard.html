<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Òjà Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../shared/css/style.css">
</head>

<body>

    <div class="admin-shell">

        <!-- Admin sidebar -->
        <aside class="admin-sidebar">
            <a class="brand-mark admin-brand" href="dashboard.html">Ò<span>j</span>à</a>
            <nav class="admin-nav">
                <a href="dashboard.html" class="admin-nav-item active">Dashboard</a>
                <a href="add-product.html" class="admin-nav-item">Add product</a>
                <a href="products.html" class="admin-nav-item">Products</a>
                <a href="orders.html" class="admin-nav-item">Orders</a>
            </nav>
        </aside>

        <!-- Admin main -->
        <main class="admin-main">
            <p class="admin-title">Dashboard</p>

            <div class="stat-grid">
                <div class="stat-card">
                    <p class="stat-label">Total items</p>
                    <p class="stat-value">128</p>
                </div>
                <div class="stat-card">
                    <p class="stat-label">Items sold</p>
                    <p class="stat-value">342</p>
                </div>
                <div class="stat-card">
                    <p class="stat-label">Pending orders</p>
                    <p class="stat-value">7</p>
                </div>
            </div>

            <div class="chart-card">
                <p class="chart-label">Sales this week</p>
                <svg width="100%" height="120" viewBox="0 0 560 120" preserveAspectRatio="none">
                    <rect x="0" y="60" width="64" height="60" fill="#1F3A5F"></rect>
                    <rect x="80" y="75" width="64" height="45" fill="#1F3A5F"></rect>
                    <rect x="160" y="35" width="64" height="85" fill="#1F3A5F"></rect>
                    <rect x="240" y="50" width="64" height="70" fill="#1F3A5F"></rect>
                    <rect x="320" y="10" width="64" height="110" fill="#E3A008"></rect>
                    <rect x="400" y="55" width="64" height="65" fill="#1F3A5F"></rect>
                    <rect x="480" y="42" width="64" height="78" fill="#1F3A5F"></rect>
                </svg>
                <div class="chart-labels">
                    <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
                </div>
            </div>

            <div class="recent-orders">
                <p class="chart-label">Recent orders</p>
                <div class="order-row">
                    <span>Order #0481 &mdash; Ankara Print Shirt</span>
                    <span class="status-badge status-pending">Pending</span>
                </div>
                <div class="order-row">
                    <span>Order #0480 &mdash; Wireless Earbuds</span>
                    <span class="status-badge status-approved">Approved</span>
                </div>
                <div class="order-row">
                    <span>Order #0479 &mdash; Leather Sandals</span>
                    <span class="status-badge status-approved">Approved</span>
                </div>
            </div>

        </main>

    </div>

</body>

</html>
