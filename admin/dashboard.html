<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Òjà Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../shared/css/style.css">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="../shared/js/firebase-config.js"></script>
    <script src="../shared/js/admin-guard.js"></script>
    <script src="../shared/js/presence.js"></script>
</head>

<body>

    <div class="admin-shell">

        <!-- ===================== ADMIN SIDEBAR ===================== -->
        <aside class="admin-sidebar">
            <a class="brand-mark admin-brand" href="dashboard.html">Ò<span>j</span>à</a>
            <nav class="admin-nav">
                <a href="dashboard.html" class="admin-nav-item active">Dashboard</a>
                <a href="add-product.html" class="admin-nav-item">Add product</a>
                <a href="products.html" class="admin-nav-item">Products</a>
                <a href="orders.html" class="admin-nav-item">Orders</a>
            </nav>
        </aside>

        <!-- ===================== ADMIN MAIN ===================== -->
        <main class="admin-main">
            <p class="admin-title">Dashboard</p>

            <!-- ===== Stat cards ===== -->
            <div class="stat-grid">
                <div class="stat-card">
                    <p class="stat-label">Total items</p>
                    <p class="stat-value" id="statTotalItems">&hellip;</p>
                </div>
                <div class="stat-card">
                    <p class="stat-label">Items sold</p>
                    <p class="stat-value" id="statItemsSold">&hellip;</p>
                </div>
                <div class="stat-card">
                    <p class="stat-label">Pending orders</p>
                    <p class="stat-value" id="statPendingOrders">&hellip;</p>
                </div>
            </div>

            <!-- ===== Sales chart ===== -->
            <div class="chart-card">
                <p class="chart-label">Sales — last 7 days</p>
                <div id="chartContainer"></div>
            </div>

            <!-- ===== Live "who's viewing" panel ===== -->
            <div class="activity-panel">
                <p class="chart-label">Live on site right now</p>
                <div id="liveActivityList">
                    <div class="activity-row"><span>No one is currently browsing a product.</span></div>
                </div>
            </div>

            <!-- ===== Recent orders ===== -->
            <div class="recent-orders">
                <p class="chart-label">Recent orders</p>
                <div id="recentOrdersList"></div>
            </div>

        </main>

    </div>

    <script>
        // ===================== STAT: TOTAL ITEMS =====================
        db.collection("products").get().then(function (snapshot) {
            document.getElementById("statTotalItems").textContent = snapshot.size;
        });

        // ===================== STATS: SOLD, PENDING, CHART, RECENT =====================
        db.collection("orders").get().then(function (snapshot) {
            let itemsSold = 0;
            let pendingCount = 0;
            const revenueByDay = {};

            // Build a lookup table for the last 7 calendar days, ending today.
            const days = [];
            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                days.push(d);
                revenueByDay[d.toDateString()] = 0;
            }

            const orders = snapshot.docs.map(function (doc) {
                return { id: doc.id, data: doc.data() };
            });

            orders.forEach(function (order) {
                if (order.data.status === "pending") {
                    pendingCount++;
                }

                if (order.data.status === "approved") {
                    order.data.items.forEach(function (item) {
                        itemsSold += item.quantity;
                    });

                    if (order.data.createdAt) {
                        const orderDate = order.data.createdAt.toDate().toDateString();
                        if (revenueByDay.hasOwnProperty(orderDate)) {
                            revenueByDay[orderDate] += order.data.total;
                        }
                    }
                }
            });

            document.getElementById("statItemsSold").textContent = itemsSold;
            document.getElementById("statPendingOrders").textContent = pendingCount;

            // --- Build the bar chart ---
            const values = days.map(function (d) { return revenueByDay[d.toDateString()]; });
            const maxValue = Math.max.apply(null, values.concat([1])); // avoid divide-by-zero on an empty week

            let bars = "";
            let labels = "";

            days.forEach(function (d, index) {
                const value = values[index];
                const height = Math.max(4, Math.round((value / maxValue) * 110));
                const x = index * 80;
                const color = value === maxValue && value > 0 ? "#E3A008" : "#1F3A5F";

                bars += '<rect x="' + x + '" y="' + (120 - height) + '" width="64" height="' + height + '" fill="' + color + '"></rect>';
                labels += "<span>" + d.toLocaleDateString("en-US", { weekday: "short" }) + "</span>";
            });

            document.getElementById("chartContainer").innerHTML =
                '<svg width="100%" height="120" viewBox="0 0 560 120" preserveAspectRatio="none">' + bars + '</svg>' +
                '<div class="chart-labels">' + labels + '</div>';

            // --- Recent orders list (most recent 5) ---
            const recentOrders = orders
                .sort(function (a, b) {
                    return (b.data.createdAt ? b.data.createdAt.seconds : 0) - (a.data.createdAt ? a.data.createdAt.seconds : 0);
                })
                .slice(0, 5);

            const recentContainer = document.getElementById("recentOrdersList");

            if (recentOrders.length === 0) {
                recentContainer.innerHTML = "<p>No orders yet.</p>";
                return;
            }

            recentContainer.innerHTML = recentOrders.map(function (order) {
                const itemsSummary = order.data.items.map(function (i) { return i.name; }).join(", ");
                const badge = order.data.status === "approved"
                    ? '<span class="status-badge status-approved">Approved</span>'
                    : '<span class="status-badge status-pending">Pending</span>';

                return '<div class="order-row">' +
                    '<span>Order #' + order.id.slice(0, 6).toUpperCase() + ' &mdash; ' + itemsSummary + '</span>' +
                    badge +
                    '</div>';
            }).join("");
        });

        // ===================== LIVE ACTIVITY PANEL =====================
        watchAllActivity(function (list) {
            const container = document.getElementById("liveActivityList");

            if (list.length === 0) {
                container.innerHTML = '<div class="activity-row"><span>No one is currently browsing a product.</span></div>';
                return;
            }

            container.innerHTML = list.map(function (row) {
                return '<div class="activity-row">' +
                    '<span>' + row.productName + '</span>' +
                    '<span class="activity-count">' + row.count + (row.count === 1 ? ' viewer' : ' viewers') + '</span>' +
                    '</div>';
            }).join("");
        });
    </script>

</body>

</html>
