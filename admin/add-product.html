<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add a product — Òjà Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../shared/css/style.css">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="../shared/js/firebase-config.js"></script>
    <script src="../shared/js/admin-guard.js"></script>
</head>

<body>

    <div class="admin-shell">

        <!-- ===================== ADMIN SIDEBAR ===================== -->
        <aside class="admin-sidebar">
            <a class="brand-mark admin-brand" href="dashboard.html">Ò<span>j</span>à</a>
            <nav class="admin-nav">
                <a href="dashboard.html" class="admin-nav-item">Dashboard</a>
                <a href="add-product.html" class="admin-nav-item active">Add product</a>
                <a href="products.html" class="admin-nav-item">Products</a>
                <a href="orders.html" class="admin-nav-item">Orders</a>
            </nav>
        </aside>

        <!-- ===================== ADD PRODUCT FORM ===================== -->
        <main class="admin-main">
            <p class="admin-title">Add a product</p>

            <p class="form-error alert alert-danger" id="formError" hidden></p>
            <p class="form-success alert alert-success" id="formSuccess" hidden></p>

            <form class="product-form" id="addProductForm">

                <!-- Photo upload: resized + compressed in-browser before saving -->
                <label class="dropzone" for="productPhoto" id="dropzoneLabel">
                    <span id="dropzoneText">Click to upload a product photo (optional)</span>
                    <img class="dropzone-preview" id="dropzonePreview" alt="Product preview">
                    <input type="file" id="productPhoto" accept="image/*" hidden>
                </label>

                <div class="form-group">
                    <label class="form-label" for="productName">Product name</label>
                    <input class="form-input" type="text" id="productName" placeholder="e.g. Ankara Print Shirt">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="category">Category</label>
                        <select class="form-select" id="category">
                            <option>Fashion</option>
                            <option>Phones &amp; Tablets</option>
                            <option>Electronics</option>
                            <option>Home &amp; Living</option>
                            <option>Beauty</option>
                            <option>Bags &amp; Shoes</option>
                            <option>Groceries</option>
                            <option>Kids</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="quantity">Quantity</label>
                        <input class="form-input" type="number" id="quantity" placeholder="20" min="0">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="price">Price</label>
                        <input class="form-input" type="text" id="price" placeholder="12000">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="discountPrice">Discounted price (optional)</label>
                        <input class="form-input" type="text" id="discountPrice" placeholder="8500">
                    </div>
                </div>

                <div class="mt-4 mb-3">
                    <div class="form-label" style="margin-bottom: 10px;">Preview</div>
                    <div id="productPreview" style="display: flex; gap: 16px; align-items: center; background: #f7f7f7; border: 1px solid #e8e8e8; border-radius: 12px; padding: 16px; max-width: 620px;">
                        <img id="previewImage" src="" alt="Product preview" style="width: 110px; height: 110px; object-fit: cover; border-radius: 10px; background: #ececec; border: 1px solid #ddd; display: none;">
                        <div style="flex: 1; min-width: 0;">
                            <div id="previewCategory" style="font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: #3A6B35; font-weight: 700;">Fashion</div>
                            <h3 id="previewName" style="margin: 6px 0; font-size: 1.3rem; color: #1F3A5F;">Product name</h3>
                            <div id="previewPrice" style="font-size: 1.1rem; font-weight: 700; color: #1F3A5F;">₦0</div>
                            <div id="previewStock" style="margin-top: 6px; font-size: 0.9rem; color: #666;">Stock: 0 items</div>
                        </div>
                    </div>
                </div>

                <button class="btn-save btn-save-inline" type="submit">Save product</button>

            </form>
        </main>

    </div>

    <script>
        // ===================== SETUP =====================
        const form = document.getElementById("addProductForm");
        const errorBox = document.getElementById("formError");
        const successBox = document.getElementById("formSuccess");
        const submitBtn = form.querySelector("button[type='submit']");
        const previewName = document.getElementById("previewName");
        const previewCategory = document.getElementById("previewCategory");
        const previewPrice = document.getElementById("previewPrice");
        const previewStock = document.getElementById("previewStock");
        const previewImage = document.getElementById("previewImage");

        function formatCurrency(amount) {
            if (Number.isNaN(amount) || amount === null || amount === undefined) {
                return "₦0";
            }
            return new Intl.NumberFormat("en-NG", {
                style: "currency",
                currency: "NGN",
                maximumFractionDigits: 0
            }).format(amount);
        }

        function readNumber(value) {
            if (!value || value === "") return NaN;
            const cleaned = String(value).replace(/[^0-9.]/g, "");
            return Number(cleaned);
        }

        function showError(message) {
            successBox.hidden = true;
            errorBox.textContent = message;
            errorBox.hidden = false;
        }

        function showSuccess(message) {
            errorBox.hidden = true;
            successBox.textContent = message;
            successBox.hidden = false;
        }

        function clearMessages() {
            errorBox.hidden = true;
            successBox.hidden = true;
        }

        function updatePreview() {
            const name = document.getElementById("productName").value.trim();
            const category = document.getElementById("category").value;
            const quantity = parseInt(document.getElementById("quantity").value, 10) || 0;
            const price = readNumber(document.getElementById("price").value);
            const discountPrice = readNumber(document.getElementById("discountPrice").value);

            previewName.textContent = name || "Product name";
            previewCategory.textContent = category || "Fashion";
            previewStock.textContent = "Stock: " + quantity + (quantity === 1 ? " item" : " items");

            if (!Number.isNaN(price) && price > 0) {
                previewPrice.textContent = formatCurrency(price);
                if (!Number.isNaN(discountPrice) && discountPrice > 0 && discountPrice < price) {
                    previewPrice.innerHTML = formatCurrency(discountPrice) + ' <span style="text-decoration: line-through; color: #888; font-size: 0.85rem; margin-left: 8px;">' + formatCurrency(price) + '</span>';
                } else {
                    previewPrice.innerHTML = formatCurrency(price);
                }
            } else {
                previewPrice.textContent = "₦0";
            }

            if (photoDataUrl) {
                previewImage.src = photoDataUrl;
                previewImage.style.display = "block";
            } else {
                previewImage.style.display = "none";
            }
        }

        [
            document.getElementById("productName"),
            document.getElementById("category"),
            document.getElementById("quantity"),
            document.getElementById("price"),
            document.getElementById("discountPrice")
        ].forEach(function (field) {
            field.addEventListener("input", updatePreview);
            field.addEventListener("change", updatePreview);
        });

        // ===================== PHOTO UPLOAD + COMPRESSION =====================
        // Resizes the chosen image down to MAX_PHOTO_WIDTH and re-encodes it
        // as a compressed JPEG, entirely in the browser, before it's ever
        // saved. Note: Firestore documents are capped at 1MiB — this keeps
        // typical photos safely under that, but very large/detailed source
        // images could still occasionally push close to the limit.
        const photoInput = document.getElementById("productPhoto");
        const dropzonePreview = document.getElementById("dropzonePreview");
        const dropzoneText = document.getElementById("dropzoneText");
        let photoDataUrl = null;

        const MAX_PHOTO_WIDTH = 600;

        photoInput.addEventListener("change", function () {
            const file = photoInput.files[0];
            if (!file) return;

            if (!file.type.startsWith("image/")) {
                showError("Please choose an image file.");
                photoInput.value = "";
                return;
            }

            const reader = new FileReader();
            reader.onload = function (event) {
                const img = new Image();
                img.onload = function () {
                    const scale = Math.min(1, MAX_PHOTO_WIDTH / img.width);
                    const canvas = document.createElement("canvas");
                    canvas.width = img.width * scale;
                    canvas.height = img.height * scale;

                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    photoDataUrl = canvas.toDataURL("image/jpeg", 0.72);

                    dropzonePreview.src = photoDataUrl;
                    dropzonePreview.style.display = "block";
                    dropzoneText.textContent = "Photo selected — click to change it";
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // ===================== SAVE PRODUCT =====================
        function validateProduct() {
            const name = document.getElementById("productName").value.trim();
            const category = document.getElementById("category").value.trim();
            const quantity = parseInt(document.getElementById("quantity").value, 10);
            const priceText = document.getElementById("price").value.trim();
            const discountText = document.getElementById("discountPrice").value.trim();

            if (!name || name.length < 2) {
                return "Product name must be at least 2 characters long.";
            }

            if (!category) {
                return "Please choose a category.";
            }

            if (Number.isNaN(quantity) || quantity < 0 || !Number.isInteger(quantity)) {
                return "Quantity must be a valid whole number greater than or equal to 0.";
            }

            if (!priceText) {
                return "Regular price is required.";
            }

            const price = readNumber(priceText);
            if (Number.isNaN(price) || price <= 0) {
                return "Price must be a valid number greater than 0.";
            }

            if (discountText) {
                const discountPrice = readNumber(discountText);
                if (Number.isNaN(discountPrice) || discountPrice <= 0) {
                    return "Discounted price must be a valid number greater than 0.";
                }
                if (discountPrice >= price) {
                    return "Discounted price must be lower than the regular price.";
                }
            }

            return null;
        }

        form.addEventListener("submit", function (event) {
            event.preventDefault();
            clearMessages();

            const validationError = validateProduct();
            if (validationError) {
                showError(validationError);
                return;
            }

            const name = document.getElementById("productName").value.trim();
            const category = document.getElementById("category").value;
            const quantity = parseInt(document.getElementById("quantity").value, 10);
            const priceText = document.getElementById("price").value.trim();
            const discountText = document.getElementById("discountPrice").value.trim();

            const price = readNumber(priceText);
            const discountPrice = discountText ? readNumber(discountText) : null;

            submitBtn.disabled = true;
            submitBtn.textContent = "Saving...";

            db.collection("products").add({
                name: name,
                category: category,
                price: price,
                discountPrice: discountPrice,
                quantity: quantity,
                photoUrl: photoDataUrl,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            })
                .then(function () {
                    showSuccess("Product saved! Redirecting to your product list...");
                    setTimeout(function () {
                        window.location.href = "products.html";
                    }, 900);
                })
                .catch(function (error) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Save product";
                    if (error.code === "permission-denied") {
                        showError("Firestore blocked this write — check your security rules and that your account has role: admin.");
                    } else {
                        showError("Something went wrong. Please try again.");
                    }
                });
        });
    </script>

</body>

</html>
