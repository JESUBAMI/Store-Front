<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add a product — Òjà Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../shared/css/style.css">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="../shared/js/firebase-config.js"></script>
    <script src="../shared/js/admin-guard.js"></script>
</head>

<body>

    <div class="admin-shell">

        <!-- Admin sidebar -->
        <aside class="admin-sidebar">
            <a class="brand-mark admin-brand" href="dashboard.html">Ò<span>j</span>à</a>
            <nav class="admin-nav">
                <a href="dashboard.html" class="admin-nav-item">Dashboard</a>
                <a href="add-product.html" class="admin-nav-item active">Add product</a>
                <a href="products.html" class="admin-nav-item">Products</a>
                <a href="orders.html" class="admin-nav-item">Orders</a>
            </nav>
        </aside>

        <!-- Admin main -->
        <main class="admin-main">
            <p class="admin-title">Add a product</p>

            <p class="form-error" id="formError" hidden></p>

            <form class="product-form" id="addProductForm">

                <label class="dropzone" for="productPhoto">
                    <span>Photo upload coming soon &mdash; product will use a placeholder for now</span>
                    <input type="file" id="productPhoto" accept="image/*" hidden disabled>
                </label>

                <div class="form-group">
                    <label class="form-label" for="productName">Product name</label>
                    <input class="form-input" type="text" id="productName" placeholder="e.g. Ankara Print Shirt">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="category">Category</label>
                        <select class="form-select" id="category">
                            <option>Fashion</option>
                            <option>Phones &amp; Tablets</option>
                            <option>Electronics</option>
                            <option>Home &amp; Living</option>
                            <option>Beauty</option>
                            <option>Bags &amp; Shoes</option>
                            <option>Groceries</option>
                            <option>Kids</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="quantity">Quantity</label>
                        <input class="form-input" type="number" id="quantity" placeholder="20" min="0">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="price">Price</label>
                        <input class="form-input" type="text" id="price" placeholder="12000">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="discountPrice">Discounted price (optional)</label>
                        <input class="form-input" type="text" id="discountPrice" placeholder="8500">
                    </div>
                </div>

                <button class="btn-save btn-save-inline" type="submit">Save product</button>

            </form>
        </main>

    </div>

    <script>
        const form = document.getElementById("addProductForm");
        const errorBox = document.getElementById("formError");
        const submitBtn = form.querySelector("button[type='submit']");

        function showError(message) {
            errorBox.textContent = message;
            errorBox.hidden = false;
        }

        function clearError() {
            errorBox.hidden = true;
            errorBox.textContent = "";
        }

        form.addEventListener("submit", function (event) {
            event.preventDefault();
            clearError();

            const name = document.getElementById("productName").value.trim();
            const category = document.getElementById("category").value;
            const quantity = parseInt(document.getElementById("quantity").value, 10);
            const priceText = document.getElementById("price").value.trim();
            const discountText = document.getElementById("discountPrice").value.trim();

            if (!name || !priceText || isNaN(quantity)) {
                showError("Please fill in the product name, quantity, and price.");
                return;
            }

            const price = parseFloat(priceText.replace(/[^0-9.]/g, ""));
            const discountPrice = discountText ? parseFloat(discountText.replace(/[^0-9.]/g, "")) : null;

            if (isNaN(price)) {
                showError("Price must be a valid number.");
                return;
            }

            if (discountText && isNaN(discountPrice)) {
                showError("Discounted price must be a valid number.");
                return;
            }

            if (discountPrice !== null && discountPrice >= price) {
                showError("Discounted price must be lower than the regular price.");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Saving...";

            db.collection("products").add({
                name: name,
                category: category,
                price: price,
                discountPrice: discountPrice,
                quantity: quantity,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            })
                .then(function () {
                    window.location.href = "products.html";
                })
                .catch(function (error) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Save product";
                    showError("Something went wrong. Please try again.");
                });
        });
    </script>

</body>

</html>
