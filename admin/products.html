<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products — Òjà Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/shared/css/style.css">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="/shared/js/firebase-config.js"></script>
    <script src="/shared/js/admin-guard.js"></script>
</head>

<body>

    <div class="admin-shell">

        <!-- ===================== ADMIN SIDEBAR ===================== -->
        <aside class="admin-sidebar">
            <a class="brand-mark admin-brand" href="dashboard.html">Ò<span>j</span>à</a>
            <nav class="admin-nav">
                <a href="dashboard.html" class="admin-nav-item">Dashboard</a>
                <a href="add-product.html" class="admin-nav-item">Add product</a>
                <a href="products.html" class="admin-nav-item active">Products</a>
                <a href="orders.html" class="admin-nav-item">Orders</a>
            </nav>
        </aside>

        <!-- ===================== PRODUCTS TABLE ===================== -->
        <main class="admin-main">
            <p class="admin-title">All products</p>

            <div class="row mb-3 gx-3">
                <div class="col-md-3">
                    <div class="card h-100">
                        <div class="card-body">
                            <p class="text-muted mb-1">Total</p>
                            <h4 class="mb-0" id="summaryTotal">0</h4>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card h-100">
                        <div class="card-body">
                            <p class="text-muted mb-1">In stock</p>
                            <h4 class="mb-0 text-success" id="summaryInStock">0</h4>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card h-100">
                        <div class="card-body">
                            <p class="text-muted mb-1">Sold out</p>
                            <h4 class="mb-0 text-danger" id="summarySoldOut">0</h4>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card h-100">
                        <div class="card-body">
                            <p class="text-muted mb-1">Low stock</p>
                            <h4 class="mb-0 text-warning" id="summaryLowStock">0</h4>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mb-3">
                <div class="card-body">
                    <div class="row g-3 align-items-center">
                        <div class="col-md-8">
                            <input type="text" id="productSearch" class="form-control" placeholder="Search product name...">
                        </div>
                        <div class="col-md-4">
                            <label class="visually-hidden" for="productStatusFilter">Filter products</label>
                            <select class="form-select" id="productStatusFilter" aria-label="Filter products">
                                <option value="all">All products</option>
                                <option value="in-stock">In stock</option>
                                <option value="low-stock">Low stock</option>
                                <option value="sold-out">Sold out</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <p class="form-error alert alert-danger" id="formError" hidden></p>
            <p class="form-success alert alert-success" id="formSuccess" hidden></p>

            <div class="products-table-wrap">
                <table class="products-table">
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <!-- Filled in by loadProducts() below -->
                    <tbody id="productsTableBody">
                    </tbody>
                </table>
            </div>

        </main>

    </div>

    <!-- ===================== EDIT STOCK MODAL ===================== -->
    <div class="modal fade" id="editStockModal" tabindex="-1" aria-labelledby="editStockLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editStockLabel">Edit Stock</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p><strong>Product:</strong> <span id="stockProductName"></span></p>
                    <label for="stockInput" class="form-label">New Stock Quantity:</label>
                    <input type="number" class="form-control" id="stockInput" min="0" value="0">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="updateStockBtn">Update Stock</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===================== SETUP =====================
        const tableBody = document.getElementById("productsTableBody");
        const errorBox = document.getElementById("formError");
        const successBox = document.getElementById("formSuccess");
        const productSearch = document.getElementById("productSearch");
        const productStatusFilter = document.getElementById("productStatusFilter");
        const summaryTotal = document.getElementById("summaryTotal");
        const summaryInStock = document.getElementById("summaryInStock");
        const summarySoldOut = document.getElementById("summarySoldOut");
        const summaryLowStock = document.getElementById("summaryLowStock");
        const swatchColors = ["#E7DCC3", "#D9E3D0", "#EFDCE0", "#DCE6EF", "#E3D5E8", "#D6E0E3", "#E9DFC8", "#DDE5D1"];
        let allProducts = [];

        function flashSuccess(message) {
            errorBox.hidden = true;
            successBox.textContent = message;
            successBox.hidden = false;
            setTimeout(function () { successBox.hidden = true; }, 2500);
        }

        function flashError(message) {
            successBox.hidden = true;
            errorBox.textContent = message;
            errorBox.hidden = false;
        }

        function updateSummary(products) {
            const total = products.length;
            const inStock = products.filter(function (item) { return item.quantity > 0; }).length;
            const soldOut = products.filter(function (item) { return item.quantity === 0; }).length;
            const lowStock = products.filter(function (item) { return item.quantity > 0 && item.quantity <= 5; }).length;

            summaryTotal.textContent = total;
            summaryInStock.textContent = inStock;
            summarySoldOut.textContent = soldOut;
            summaryLowStock.textContent = lowStock;
        }

        function getFilteredProducts() {
            const term = (productSearch.value || "").trim().toLowerCase();
            const filter = productStatusFilter.value;

            return allProducts.filter(function (product) {
                const matchesSearch = !term || (product.name || "").toLowerCase().includes(term);
                let matchesFilter = true;

                if (filter === "in-stock") matchesFilter = product.quantity > 0;
                if (filter === "low-stock") matchesFilter = product.quantity > 0 && product.quantity <= 5;
                if (filter === "sold-out") matchesFilter = product.quantity === 0;

                return matchesSearch && matchesFilter;
            });
        }

        function renderProducts(products) {
            tableBody.innerHTML = "";
            updateSummary(allProducts);

            if (!products.length) {
                tableBody.innerHTML = "<tr><td colspan='5'>No matching products found.</td></tr>";
                return;
            }

            products.forEach(function (product, index) {
                const isSoldOut = product.quantity <= 0;
                const isLowStock = product.quantity > 0 && product.quantity <= 5;
                const color = swatchColors[index % swatchColors.length];
                const displayPrice = product.discountPrice || product.price;

                const swatchInner = product.photoUrl
                    ? '<img src="' + product.photoUrl + '" alt="">'
                    : "";
                const swatchStyle = product.photoUrl ? "" : "background-color:" + color + ";";
                const statusHtml = isSoldOut
                    ? '<span class="status-badge status-out">Sold out</span>'
                    : isLowStock
                        ? '<span class="status-badge status-pending">Low stock</span>'
                        : '<span class="status-badge status-in">In stock</span>';

                const row = document.createElement("tr");
                row.innerHTML =
                    '<td><div class="table-item">' +
                        '<span class="table-swatch" style="' + swatchStyle + '">' + swatchInner + '</span>' +
                        product.name +
                    '</div></td>' +
                    '<td>&#8358;' + Number(displayPrice || 0).toLocaleString() + '</td>' +
                    '<td>' + product.quantity + '</td>' +
                    '<td>' + statusHtml + '</td>' +
                    '<td>' +
                        '<a href="../store/product.html?id=' + product.id + '" class="table-action" target="_blank">View</a>' +
                        '<a href="#" class="table-action" data-id="' + product.id + '" data-stock="' + product.quantity + '">Edit stock</a>' +
                        '<a href="#" class="table-action danger" data-id="' + product.id + '">Delete</a>' +
                    '</td>';

                tableBody.appendChild(row);
            });

            document.querySelectorAll(".table-action.danger").forEach(function (link) {
                link.addEventListener("click", function (event) {
                    event.preventDefault();
                    const id = link.getAttribute("data-id");
                    if (confirm("Delete this product? This cannot be undone.")) {
                        db.collection("products").doc(id).delete()
                            .then(function () {
                                flashSuccess("Product deleted.");
                                loadProducts();
                            })
                            .catch(function () {
                                flashError("Could not delete this product. Check your permissions.");
                            });
                    }
                });
            });
        }

        function loadProducts() {
            tableBody.innerHTML = "<tr><td colspan='5'>Loading...</td></tr>";

            db.collection("products").orderBy("createdAt", "desc").get()
                .then(function (snapshot) {
                    allProducts = snapshot.docs.map(function (doc) {
                        return { id: doc.id, ...doc.data() };
                    });

                    renderProducts(getFilteredProducts());
                })
                .catch(function (error) {
                    const message = error.code === "permission-denied"
                        ? "Firestore blocked this read — check your security rules and that your account has role: admin."
                        : "Could not load products.";
                    tableBody.innerHTML = "<tr><td colspan='5'>" + message + "</td></tr>";
                });
        }

        productSearch.addEventListener("input", function () {
            renderProducts(getFilteredProducts());
        });

        productStatusFilter.addEventListener("change", function () {
            renderProducts(getFilteredProducts());
        });

        loadProducts();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ===================== EDIT STOCK FUNCTIONALITY =====================
        let currentEditProductId = null;
        const stockModal = new bootstrap.Modal(document.getElementById("editStockModal"));

        document.addEventListener("click", function (event) {
            if (event.target.classList.contains("table-action") && !event.target.classList.contains("danger")) {
                event.preventDefault();
                const id = event.target.getAttribute("data-id");
                const stock = event.target.getAttribute("data-stock");
                const productName = event.target.parentElement.parentElement.querySelector(".table-item").textContent;

                currentEditProductId = id;
                document.getElementById("stockProductName").textContent = productName;
                document.getElementById("stockInput").value = stock;
                stockModal.show();
            }
        });

        document.getElementById("updateStockBtn").addEventListener("click", function () {
            const newStock = parseInt(document.getElementById("stockInput").value);

            if (isNaN(newStock) || newStock < 0) {
                flashError("Please enter a valid stock number (0 or higher).");
                return;
            }

            db.collection("products").doc(currentEditProductId).update({
                quantity: newStock
            })
                .then(function () {
                    flashSuccess("Stock updated successfully!");
                    stockModal.hide();
                    loadProducts();
                })
                .catch(function (error) {
                    flashError("Could not update stock. Check your permissions.");
                    console.error(error);
                });
        });
    </script>

</body>

</html>
