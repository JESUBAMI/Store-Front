<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products — Òjà Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../shared/css/style.css">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="../shared/js/firebase-config.js"></script>
    <script src="../shared/js/admin-guard.js"></script>
</head>

<body>

    <div class="admin-shell">

        <!-- ===================== ADMIN SIDEBAR ===================== -->
        <aside class="admin-sidebar">
            <a class="brand-mark admin-brand" href="dashboard.html">Ò<span>j</span>à</a>
            <nav class="admin-nav">
                <a href="dashboard.html" class="admin-nav-item">Dashboard</a>
                <a href="add-product.html" class="admin-nav-item">Add product</a>
                <a href="products.html" class="admin-nav-item active">Products</a>
                <a href="orders.html" class="admin-nav-item">Orders</a>
            </nav>
        </aside>

        <!-- ===================== PRODUCTS TABLE ===================== -->
        <main class="admin-main">
            <p class="admin-title">All products</p>

            <p class="form-error alert alert-danger" id="formError" hidden></p>
            <p class="form-success alert alert-success" id="formSuccess" hidden></p>

            <div class="products-table-wrap">
                <table class="products-table">
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <!-- Filled in by loadProducts() below -->
                    <tbody id="productsTableBody">
                    </tbody>
                </table>
            </div>

        </main>

    </div>

    <script>
        // ===================== SETUP =====================
        const tableBody = document.getElementById("productsTableBody");
        const errorBox = document.getElementById("formError");
        const successBox = document.getElementById("formSuccess");
        const swatchColors = ["#E7DCC3", "#D9E3D0", "#EFDCE0", "#DCE6EF", "#E3D5E8", "#D6E0E3", "#E9DFC8", "#DDE5D1"];

        function flashSuccess(message) {
            errorBox.hidden = true;
            successBox.textContent = message;
            successBox.hidden = false;
            setTimeout(function () { successBox.hidden = true; }, 2500);
        }

        function flashError(message) {
            successBox.hidden = true;
            errorBox.textContent = message;
            errorBox.hidden = false;
        }

        // ===================== LOAD + RENDER PRODUCTS =====================
        function loadProducts() {
            tableBody.innerHTML = "<tr><td colspan='5'>Loading...</td></tr>";

            db.collection("products").orderBy("createdAt", "desc").get()
                .then(function (snapshot) {
                    tableBody.innerHTML = "";

                    if (snapshot.empty) {
                        tableBody.innerHTML = "<tr><td colspan='5'>No products yet.</td></tr>";
                        return;
                    }

                    snapshot.docs.forEach(function (doc, index) {
                        const product = doc.data();
                        const isSoldOut = product.quantity <= 0;
                        const color = swatchColors[index % swatchColors.length];
                        const displayPrice = product.discountPrice || product.price;

                        const swatchInner = product.photoUrl
                            ? '<img src="' + product.photoUrl + '" alt="">'
                            : "";
                        const swatchStyle = product.photoUrl ? "" : "background-color:" + color + ";";

                        const row = document.createElement("tr");
                        row.innerHTML =
                            '<td><div class="table-item">' +
                                '<span class="table-swatch" style="' + swatchStyle + '">' + swatchInner + '</span>' +
                                product.name +
                            '</div></td>' +
                            '<td>&#8358;' + displayPrice.toLocaleString() + '</td>' +
                            '<td>' + product.quantity + '</td>' +
                            '<td>' + (isSoldOut
                                ? '<span class="status-badge status-out">Sold out</span>'
                                : '<span class="status-badge status-in">In stock</span>') + '</td>' +
                            '<td>' +
                                '<a href="../store/product.html?id=' + doc.id + '" class="table-action" target="_blank">View</a>' +
                                '<a href="#" class="table-action danger" data-id="' + doc.id + '">Delete</a>' +
                            '</td>';

                        tableBody.appendChild(row);
                    });

                    // ===== Delete button handlers =====
                    document.querySelectorAll(".table-action.danger").forEach(function (link) {
                        link.addEventListener("click", function (event) {
                            event.preventDefault();
                            const id = link.getAttribute("data-id");
                            if (confirm("Delete this product? This cannot be undone.")) {
                                db.collection("products").doc(id).delete()
                                    .then(function () {
                                        flashSuccess("Product deleted.");
                                        loadProducts();
                                    })
                                    .catch(function () {
                                        flashError("Could not delete this product. Check your permissions.");
                                    });
                            }
                        });
                    });
                })
                .catch(function (error) {
                    const message = error.code === "permission-denied"
                        ? "Firestore blocked this read — check your security rules and that your account has role: admin."
                        : "Could not load products.";
                    tableBody.innerHTML = "<tr><td colspan='5'>" + message + "</td></tr>";
                });
        }

        loadProducts();
    </script>

</body>

</html>
